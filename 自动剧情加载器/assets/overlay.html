/* @@FONT_END@@ */
:root{
  --px-y:      #ffcc00;   /* 主黄 */
  --px-y-dark: #cc9900;
  --px-y-dim:  #997a00;
  --px-bg:     #000000;
  --px-fg:     #ffffff;
  --px-gray:   #aaaaaa;
  --px-dim:    #777777;
  --px-ok:     #66ff99;
  --px-warn:   #ffaa33;
  --px-err:    #ff5555;

  /* 最小化时向左平移的距离（由 JS 按分辨率写入）。
     ★ 用户反馈「还要再向左移约 0.8 个最小化面板的宽度」，
       故基准从 260 提到 500（1920 宽下约 375px）。 */
  --mini-shift: 375px;
  /* ★ 过渡节奏：官方示例用的是 GSAP `ease:'power2.inOut'`（平滑加速-减速），
       不是 steps()。早期版本误用 steps() 导致动画一顿一顿、观感差很多。
       这里用等价的 CSS 缓动曲线还原官方手感。 */
  --px-ease: cubic-bezier(.45,.05,.55,.95);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;background:transparent;
  /* ★ 像素字体 Zpix（与官方示例 LinneaMining 同一字体，base64 内嵌于 pixel-font.css）。
     Zpix 是按 12px 设计的点阵字体，**字号取 12 的倍数**才最清晰
     （12 / 24），非倍数会被浏览器插值成模糊边缘。
     故本面板统一用 12px，时间用 24px。 */
  font-family:'Zpix',Consolas,"Cascadia Mono","Courier New",monospace;
  -webkit-font-smoothing:none;
  font-smooth:never;
  image-rendering:pixelated;
  color:var(--px-fg);
  user-select:none;
}
.overlay{width:100vw;height:100vh;position:relative}

/* ---------------- 右下角主面板 ---------------- */
.panel{
  position:absolute;right:12px;bottom:12px;width:400px;
  background:var(--px-bg);
  border:2px solid var(--px-y);
  padding:3px;
  box-shadow:2px 2px 0 #000, 2px 2px 0 1px var(--px-y-dim);
  /* ★ 最小化/展开：宽度 + 位移一起平滑过渡（0.45s，对齐官方 0.5s 的手感） */
  transition:width .45s var(--px-ease), transform .45s var(--px-ease);
  transform:translateX(0);
}
/* 入场：从右下滑入（官方示例同样是滑入，0.6s） */
.panel.enter{animation:panel-enter .6s var(--px-ease) both}
@keyframes panel-enter{
  0%{opacity:0;transform:translate(60px,40px)}
  100%{opacity:1;transform:translate(0,0)}
}
.panel-inner{border:1px solid var(--px-y-dark);padding:9px 11px;
  transition:padding .45s var(--px-ease)}

/* 四角像素点 */
.corner{position:absolute;width:3px;height:3px;background:var(--px-y)}
.c-tl{top:-3px;left:-3px} .c-tr{top:-3px;right:-3px}
.c-bl{bottom:-3px;left:-3px} .c-br{bottom:-3px;right:-3px}

/* 标题栏 */
.titlebar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.diamond{color:var(--px-y);font-size:12px;line-height:1}
/* ★ 标题必须单行：右侧新增「放弃」按钮后，最小化宽度下空间紧张，
   不加 nowrap 会折成两行。 */
.title{color:var(--px-y);font-size:13px;font-weight:700;letter-spacing:1.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.tb-btn{
  background:transparent;border:1px solid var(--px-y-dim);color:var(--px-y);
  font-family:inherit;font-size:12px;line-height:1;padding:3px 7px;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;
}
.tb-btn:hover{background:var(--px-y);color:#000;border-color:var(--px-y)}
/* 「放弃剧情」按钮：红色警示 */
.tb-btn.danger{border-color:#883333;color:#ff8888}
.tb-btn.danger:hover{background:#cc3333;color:#000;border-color:#cc3333}
/* 空闲态（无剧情可放弃）置灰 */
.tb-btn.off,.tb-btn:disabled{opacity:.35;cursor:default;border-color:var(--px-y-dim);color:var(--px-dim)}
.tb-btn.off:hover,.tb-btn:disabled:hover{background:transparent;color:var(--px-dim);border-color:var(--px-y-dim)}

/* 分隔线（黄点虚线） */
.divider{height:1px;margin:8px 0;background:repeating-linear-gradient(
  to right,var(--px-y) 0 2px,transparent 2px 4px)}

/* 信息行 */
.row{display:flex;align-items:baseline;gap:10px;line-height:1.55;margin-bottom:4px}
.row .k{color:var(--px-dim);font-size:12px;flex:0 0 52px;letter-spacing:1px}
.row .v{color:var(--px-fg);font-size:13px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v.time{color:var(--px-y);font-weight:700;font-size:24px;
  font-variant-numeric:tabular-nums;letter-spacing:1px}

/* 状态徽标 */
.st{display:inline-block;padding:2px 8px;font-size:12px;font-weight:700;
  border:1px solid currentColor;line-height:1.35}
.st-run{color:var(--px-ok)}
.st-pause{color:var(--px-warn)}
.st-bgi{color:var(--px-y)}
.st-idle{color:var(--px-gray)}
.st-done{color:var(--px-ok)}
/* 持续运行空闲态 / 放弃中 */
.st-wait{color:var(--px-y)}
.st-warn{color:var(--px-err)}

/* 状态点：运行中时闪烁（像素风的硬切换闪烁，与官方 steps(1) 一致） */
.st .dot{display:inline-block;width:8px;height:8px;margin-right:7px;
  background:currentColor;vertical-align:baseline}
.st-run .dot{animation:dot-blink .8s steps(1,end) infinite}
@keyframes dot-blink{0%,50%{opacity:1}51%,100%{opacity:0}}
/* 空闲态呼吸更慢，暗示「在等你操作」 */
.st-wait .dot{animation:dot-blink 1.6s steps(1,end) infinite}

/* 当前执行行 */
.lbl{color:var(--px-dim);font-size:12px;letter-spacing:1px;margin-bottom:4px}
.curline{
  background:#0d0d0d;border-left:3px solid var(--px-y);
  padding:7px 9px;font-size:13px;line-height:1.5;color:var(--px-fg);
  word-break:break-all;min-height:34px;
}
.curline .ln{color:var(--px-dim);font-size:11px;margin-right:6px}
.curline.empty{color:var(--px-dim)}

/* ---------------- 循环进度（地图追踪 / 键鼠脚本 的参数重载）----------------
   例：`地图追踪 路径1.json 3 主界面 true` 执行完第 1 轮时显示「第 1/3 次」。
   只在重复执行期间出现，切到下一行时由 JS 清除。 */
.loop{
  display:none;align-items:center;gap:7px;margin-top:5px;
  font-size:12px;color:var(--px-warn);
}
.loop.show{display:flex}
.loop .lt{color:var(--px-dim)}
.loop .lv{font-variant-numeric:tabular-nums;font-weight:700;color:var(--px-warn)}
/* 进度条：用等宽块表示，符合像素风 */
.loop .lbar{display:flex;gap:2px}
.loop .lbar i{width:7px;height:11px;background:#3a2a00;display:block}
.loop .lbar i.on{background:var(--px-warn)}
/* 已达上限（即将暂停）时转为警示色 */
.loop.max{color:var(--px-err)}
.loop.max .lv{color:var(--px-err)}
.loop.max .lbar i.on{background:var(--px-err)}

/* 底部提示（呼吸闪烁，与官方 hint-breathe 一致） */
.hint{
  margin-top:8px;padding-top:7px;border-top:1px solid #222;
  color:var(--px-dim);font-size:12px;letter-spacing:.5px;
  animation:hint-breathe 2s ease-in-out infinite;
}
.hint .on{color:var(--px-y);font-weight:700}
@keyframes hint-breathe{0%,100%{opacity:.3}50%{opacity:1}}

/* ---------------- 最小化形态 ----------------
   ★ 同时做两件事：
     ① 缩窄成小条
     ② 向左平移，避开游戏右下角的技能图标区

   ⚠️ 关键：最小化宽度必须是**具体像素值**（不能写 width:auto）。
     官方用 300px ↔ 100px 两个具体值，所以能平滑过渡；
     早期我们写 `width:auto`，而 CSS **无法对 auto 做插值**，
     结果宽度只能瞬间跳变、完全没有渐进动画。 */
.panel.min{
  width:250px;
  transform:translateX(calc(-1 * var(--mini-shift)));
}
.panel.min .panel-inner{padding:7px 10px}
.panel.min .titlebar{margin-bottom:0}
/* ★ 最小化时压缩标题栏，避免标题被挤成两行：
     · 标题缩小、去掉字距
     · 隐藏 ⚙ 设置按钮（最小化状态下本就该先展开再设置） */
.panel.min .title{font-size:12px;letter-spacing:0}
.panel.min #btnSettings{display:none}
.mini{display:none;align-items:center;gap:10px;margin-top:7px}
.panel.min .mini{display:flex}
.panel.min .body{display:none}
/* 最小化内容淡入：延迟到宽度动画过半再出现（对齐官方 dur*0.6 的时机），
   避免宽度收缩过程中文字被挤压变形。 */
.panel.min .mini{animation:mini-in .28s var(--px-ease) .26s both}
@keyframes mini-in{0%{opacity:0}100%{opacity:1}}
/* 展开时大内容延迟淡入（官方同样是先展宽、后半程淡入） */
.panel:not(.min) .body{animation:body-in .28s var(--px-ease) .24s both}
@keyframes body-in{0%{opacity:0}100%{opacity:1}}
.mini .mtime{color:var(--px-y);font-size:20px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:1px}
.mini .mst{font-size:12px}
/* 最小化时的循环进度（无循环时隐藏） */
.mini .mloop{display:none;font-size:12px;color:var(--px-warn);
  font-variant-numeric:tabular-nums;font-weight:700}
.mini .mloop.show{display:inline}
.mini .mloop.max{color:var(--px-err)}

/* ---------------- 居中设置窗口 ---------------- */
.mask{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
}
.mask.show{display:flex}
.modal{
  width:470px;max-width:86vw;max-height:78vh;display:flex;flex-direction:column;
  background:var(--px-bg);border:2px solid var(--px-y);padding:3px;
  box-shadow:3px 3px 0 #000,3px 3px 0 1px var(--px-y-dim);
}
.modal-inner{border:1px solid var(--px-y-dark);padding:12px 14px;
  display:flex;flex-direction:column;min-height:0}
.modal-title{color:var(--px-y);font-size:13px;font-weight:700;
  letter-spacing:1px;margin-bottom:9px}
.modal-sub{color:var(--px-dim);font-size:12px;margin-bottom:9px;line-height:1.7}
.modal-sub b{color:var(--px-gray)}

.plist{flex:1;min-height:0;overflow-y:auto;border:1px solid #333;
  background:#080808;padding:3px}
.pitem{
  display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer;
  font-size:13px;color:var(--px-gray);line-height:1.5;
}
.pitem:hover{background:#1a1a1a;color:var(--px-fg)}
.pitem.sel{background:#241f00;color:var(--px-y)}
.pitem .box{flex:0 0 12px;height:12px;border:1px solid var(--px-dim);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#000}
.pitem.sel .box{background:var(--px-y);border-color:var(--px-y)}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pitem.cur .nm::after{content:" (当前)";color:var(--px-dim);font-size:12px}
/* 剧情项右侧的「从指定行开始」按钮 */
.pitem .go{
  flex:0 0 auto;background:transparent;border:1px solid var(--px-y-dim);
  color:var(--px-y);font-family:inherit;font-size:11px;line-height:1;
  padding:3px 7px;cursor:pointer;margin-left:4px;
}
.pitem .go:hover{background:var(--px-y);color:#000;border-color:var(--px-y)}

/* ---------------- 起始行列表 ---------------- */
.llist{flex:1;min-height:0;max-height:52vh;overflow-y:auto;border:1px solid #333;
  background:#080808;padding:3px}
.lrow{
  display:flex;align-items:baseline;gap:8px;padding:4px 7px;cursor:pointer;
  font-size:12px;color:var(--px-gray);line-height:1.5;
}
.lrow:hover{background:#1a1a1a;color:var(--px-fg)}
.lrow.sel{background:#241f00;color:var(--px-y)}
.lrow .lno{flex:0 0 52px;color:var(--px-dim);font-variant-numeric:tabular-nums;
  font-size:11px;text-align:right}
.lrow.sel .lno{color:var(--px-y)}
.lrow .ltx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.lrow .tag{flex:0 0 auto;font-size:10px;padding:1px 5px;border:1px solid currentColor;
  opacity:.75;letter-spacing:0}

/* ---- 行的类别（注释/元数据/块头 不可选）---- */
/* 注释：暗色斜体，表明「这是说明，不能选」 */
.lrow.cmt{color:var(--px-dim);font-style:italic;cursor:default}
.lrow.cmt .ltx{color:var(--px-dim)}
.lrow.meta{color:var(--px-dim);cursor:default}
/* 块头：绿色加粗，便于定位 */
.lrow.head{color:var(--px-ok);cursor:default}
.lrow.head .ltx{font-weight:700}
.lrow.unk{color:var(--px-warn);cursor:default}
/* 不可选的行不显示悬停高亮 */
.lrow.cmt:hover,.lrow.meta:hover,.lrow.head:hover,.lrow.unk:hover{
  background:transparent;color:inherit}
.lrow.cmt:hover{color:var(--px-dim)}
.lrow.head:hover{color:var(--px-ok)}

/* ---- 指令按类别上色（一眼区分「导航 / 对话 / 战斗 / 等待」）---- */
.lrow.c-nav   .ltx{color:#55ddff}   /* 导航/移动/点击 */
.lrow.c-talk  .ltx{color:var(--px-y)}  /* 对话/提示 */
.lrow.c-fight .ltx{color:#cc88ff}   /* 战斗/队伍/角色 */
.lrow.c-flow  .ltx{color:var(--px-warn)} /* 等待/暂停/切换/调时间 */
.lrow.c-ext   .ltx{color:var(--px-ok)}   /* 注入/尝试/键鼠脚本 */
.lrow.c-done  .ltx{color:var(--px-ok);font-weight:700}  /* 任务完成 */
.lrow.sel .ltx{color:var(--px-y)}

.lempty{padding:10px;color:var(--px-dim);font-size:12px;text-align:center}
/* 列表顶部的图例 */
.llegend{display:flex;flex-wrap:wrap;gap:9px;padding:5px 7px;margin-bottom:4px;
  border-bottom:1px solid #2a2a2a;font-size:11px}
.llegend i{font-style:normal}
.llegend .lg-nav{color:#55ddff}
.llegend .lg-talk{color:var(--px-y)}
.llegend .lg-fight{color:#cc88ff}
.llegend .lg-flow{color:var(--px-warn)}
.llegend .lg-ext{color:var(--px-ok)}
.llegend .lg-cmt{color:var(--px-dim)}

.mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:12px}
.btn{
  font-family:inherit;font-size:13px;font-weight:700;padding:7px 18px;
  cursor:pointer;background:transparent;color:var(--px-y);
  border:1px solid var(--px-y-dim);letter-spacing:1px;
}
.btn:hover{background:#241f00}
.btn.primary{background:var(--px-y);color:#000;border-color:var(--px-y)}
.btn.primary:hover{background:#fff;border-color:#fff}

/* 滚动条 */
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:var(--px-y-dim)}
::-webkit-scrollbar-thumb:hover{background:var(--px-y)}
</style>
</head>
<body>
<div class="overlay">

  <!-- ============ 右下角运行面板 ============ -->
  <div class="panel" id="panel">
    <span class="corner c-tl"></span><span class="corner c-tr"></span>
    <span class="corner c-bl"></span><span class="corner c-br"></span>
    <div class="panel-inner">
      <div class="titlebar">
        <span class="diamond">◆</span>
        <span class="title">自动剧情加载器</span>
        <span class="spacer"></span>
        <button class="tb-btn" id="btnAbandon" title="放弃当前剧情">⏏</button>
        <button class="tb-btn" id="btnSettings" title="设置（需先按 K 进入交互模式）">⚙</button>
        <button class="tb-btn" id="btnMin" title="最小化 / 展开（N）">–</button>
      </div>

      <div class="body" id="body">
        <div class="row">
          <span class="k">已运行</span>
          <span class="v time" id="elapsed">00:00:00</span>
        </div>
        <div class="row">
          <span class="k">状态</span>
          <span class="v"><span class="st st-idle" id="status">等待中</span></span>
        </div>
        <div class="row">
          <span class="k">剧情</span>
          <span class="v" id="procName">—</span>
        </div>
        <div class="divider"></div>
        <div class="lbl">当前执行</div>
        <div class="curline empty" id="curline">等待脚本指令…</div>
        <!-- 循环进度（仅「地图追踪 / 键鼠脚本」带次数参数时出现） -->
        <div class="loop" id="loop">
          <span class="lt">循环</span>
          <span class="lv" id="loopText">0/0</span>
          <span class="lbar" id="loopBar"></span>
        </div>
      </div>

      <div class="mini">
        <span class="mtime" id="mTime">00:00:00</span>
        <span class="mst st st-idle" id="mStatus">等待中</span>
        <!-- 最小化时也显示循环进度（有则显示，无则隐藏） -->
        <span class="mloop" id="mLoop">0/0</span>
      </div>

      <div class="hint" id="hint">
        <span class="on">N</span> 最小化 · <span class="on">K</span> 交互模式
      </div>
    </div>
  </div>

  <!-- ============ 居中设置窗口 ============ -->
  <div class="mask" id="mask">
    <div class="modal">
      <span class="corner c-tl"></span><span class="corner c-tr"></span>
      <span class="corner c-bl"></span><span class="corner c-br"></span>
      <div class="modal-inner">
        <div class="modal-title">⚙ 切换剧情列表</div>
        <div class="modal-sub">
          选择要运行的 <b>process.json</b>。点击「确定切换」将<b>立即中断当前剧情</b>并开始运行所选剧情。<br>
          点每行右侧的 <b>▶</b> 可<b>从指定行开始</b>运行该剧情。
        </div>
        <div class="plist" id="plist"></div>
        <div class="mfoot">
          <button class="btn" id="btnCancel">取消</button>
          <button class="btn primary" id="btnOk">确定切换</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 选择起始行窗口（从指定行开始运行）============ -->
  <div class="mask" id="maskLines">
    <div class="modal">
      <span class="corner c-tl"></span><span class="corner c-tr"></span>
      <span class="corner c-bl"></span><span class="corner c-br"></span>
      <div class="modal-inner">
        <div class="modal-title">▶ 从指定行开始运行</div>
        <div class="modal-sub">
          剧情：<b id="linesProcName">—</b><br>
          点选一行作为<b>起点</b>；该行<b>之前</b>的指令会被全部跳过（不会执行）。<br>
          <b>注释</b>与<b>块头</b>只作说明，<b>不可选</b>。
        </div>
        <div class="llegend" id="llegend">
          <i class="lg-nav">■ 导航/点击</i>
          <i class="lg-talk">■ 对话</i>
          <i class="lg-fight">■ 战斗/队伍</i>
          <i class="lg-flow">■ 等待/流程</i>
          <i class="lg-ext">■ 扩展/脚本</i>
          <i class="lg-cmt">■ 注释（不可选）</i>
        </div>
        <div class="llist" id="llist"></div>
        <div class="mfoot">
          <button class="btn" id="btnLinesCancel">取消</button>
          <button class="btn primary" id="btnLinesOk">从选中行开始</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ==========================================================
     与 JS 侧的通信

     ★ 关键：HTML → JS 必须用 window.htmlMask.request()
       官方文档「HTML 端通信」明确写的是 htmlMask.request；
       官方示例 LinneaMining 也是这么做的（App.vue: window.htmlMask.request('/ready','{}')）。
       早期版本误用了 chrome.webview.postMessage 作为首选通道，
       该通道与 htmlMask 的消息队列并不互通，导致 /ready、/switch
       等消息全部丢失（表现为：切换剧情无反应、首屏握手超时）。

     chrome.webview.postMessage 仅作为最后的兜底。
     ========================================================== */
  var hasMask = !!(window.htmlMask);
  var hasWV   = !!(window.chrome && window.chrome.webview);

  function sendToJs(url, data) {
    // ① 首选：htmlMask.request —— 文档指定的 HTML→JS 通道
    if (window.htmlMask && typeof window.htmlMask.request === 'function') {
      try {
        var p = window.htmlMask.request(url, data || {});
        // request 返回 Promise；若 JS 侧未响应会 reject，这里吞掉避免控制台报错
        if (p && typeof p.catch === 'function') p.catch(function () {});
        return;
      } catch (e) { /* 继续尝试兜底通道 */ }
    }
    // ② 兜底：WebView2 原生通道
    if (hasWV) {
      try {
        window.chrome.webview.postMessage(JSON.stringify({ url: url, data: data || {} }));
      } catch (e) { /* 忽略 */ }
    }
  }

  /* ---------------- 状态 ---------------- */
  var S = {
    elapsedMs: 0,
    status: 'idle',        // idle | waiting | running | paused | done | abandoning
    line: '',
    lineNo: 0,
    /* ★ 循环进度（「地图追踪 / 键鼠脚本」带次数参数时）
       loopDone = 已完成次数，loopTotal = 最大次数；loopTotal=0 表示不显示 */
    loopDone: 0,
    loopTotal: 0,
    process: '',
    processes: [],         // [{name, path}]
    minimized: false,
    interactive: false,
    lastMsgAt: 0,
    /* ★ 持续运行模式：脚本挂载着但不跑剧情，等用户选 */
    persistent: false,
    /* ★ 「从指定行开始」：当前选中的剧情名、起始行、行列表 */
    linePickName: '',
    linePickSel: 0,
    linePickLines: [],
    /* ★ 运行时间基准（版本 8 新增，修复「时间恒为 00:00:00」）
       JS 侧只在开始/切换剧情时推送 elapsedMs，之后长时间不再推送。
       所以不能直接显示它，而要记下「基准值 + 基准时刻」，
       再由本地定时器推算当前值。 */
    baseElapsed: 0,
    baseAt: 0
  };

  /* ★ 最小化指令去重：JS 侧会「直发 + 兜底重发」，可能送达多次。
     只处理 seq 更大的请求，保证一次按键只切换一次（不会来回跳）。
     seq 缺省时按 0 处理 → 兼容旧版 JS。 */
  var lastToggleSeq = -1;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- 运行时间 ---------------- */

  /** 用 JS 推送的值重新校准基准 */
  function syncElapsed(ms) {
    if (typeof ms !== 'number') return;
    S.baseElapsed = ms;
    S.baseAt = Date.now();
    S.elapsedMs = ms;
  }

  /** 按基准推算「当前」已运行毫秒数 */
  function currentElapsed() {
    if (!S.baseAt) return S.baseElapsed;
    return S.baseElapsed + (Date.now() - S.baseAt);
  }

  /* ---------------- 渲染 ---------------- */
  function fmtTime(ms) {
    var t = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(h) + ':' + p(m) + ':' + p(s);
  }

  /** 只更新时间显示（定时器每 250ms 调用，尽量轻量） */
  function renderTime() {
    var t = fmtTime(currentElapsed());
    var e = $('elapsed');
    if (e) e.textContent = t;
    var m = $('mTime');
    if (m) m.textContent = t;
  }

  function statusView() {
    // 注意：文字里不再自带箭头，箭头改由闪烁的状态点承担
    if (S.status === 'paused')      return { cls: 'st-pause', text: '已暂停（脚本）', dot: true };
    if (S.status === 'done')        return { cls: 'st-done',  text: '已完成',         dot: true };
    if (S.status === 'running')     return { cls: 'st-run',   text: '运行中',         dot: true };
    if (S.status === 'abandoning')  return { cls: 'st-warn',  text: '正在放弃…',      dot: true };
    // ★ 持续运行模式的空闲态：脚本挂载着，等用户选剧情
    if (S.status === 'waiting')     return { cls: 'st-wait',  text: '等待选择剧情',   dot: true };
    return { cls: 'st-idle', text: '等待中', dot: true };
  }

  /** 循环进度条（「地图追踪 / 键鼠脚本」带次数参数时显示）
      例：第 1/3 次 → 显示「循环 1/3」+ 三个方块（第 1 个点亮） */
  function renderLoop() {
    var box = $('loop');
    if (!box) return;
    var total = S.loopTotal | 0;
    var done = S.loopDone | 0;

    /* 最小化版同步显示 */
    var ml = $('mLoop');
    if (ml) {
      if (total > 0) {
        ml.textContent = done + '/' + total;
        ml.className = 'mloop show' + (done >= total ? ' max' : '');
      } else {
        ml.className = 'mloop';
      }
    }

    if (total <= 0) { box.className = 'loop'; return; }   // 不显示

    var txt = $('loopText');
    if (txt) txt.textContent = done + '/' + total;

    // 已达上限（下一次就会触发暂停判定）→ 用警示色
    box.className = 'loop show' + (done >= total ? ' max' : '');

    var bar = $('loopBar');
    if (bar) {
      // 方块数量不超过 20 个，避免 99 次时撑破面板
      var shown = Math.min(total, 20);
      var html = '';
      for (var i = 0; i < shown; i++) {
        // 按比例映射：total > shown 时用比例判断点亮
        var lit = (done / total) > (i / shown);
        html += '<i class="' + (lit ? 'on' : '') + '"></i>';
      }
      bar.innerHTML = html;
    }
  }

  /** 底部提示（含呼吸动画）；最小化时文案不同 */
  function renderHint() {    var el = $('hint');
    if (!el) return;
    if (S.minimized) {
      el.innerHTML = '<span class="on">N</span> 展开面板';
      return;
    }
    if (S.persistent && S.status === 'waiting') {
      el.innerHTML = '<span class="on">⚙</span> 选择剧情开始 · <span class="on">N</span> 最小化';
      return;
    }
    el.innerHTML = '<span class="on">N</span> 最小化 · ' +
      (S.interactive
        ? '<span class="on">K</span> 退出交互模式（当前可点击）'
        : '<span class="on">K</span> 交互模式');
  }

  /**
   * 「放弃剧情」按钮。
   * 图案选 ⏏（弹出/推出符号）—— 语义是「把当前剧情弹出去」，
   * 比 ✕（关闭）更贴合「放弃」；且与 ⚙（设置）、–（最小化）风格一致。
   */
  function renderAbandon() {
    var btn = $('btnAbandon');
    if (!btn) return;
    var idle = (S.status === 'waiting');
    btn.title = S.persistent
      ? '放弃当前剧情（回到等待选择状态）'
      : '放弃当前剧情并结束脚本';
    // 空闲态没有剧情可放弃 → 置灰禁用
    btn.disabled = idle;
    btn.className = 'tb-btn danger' + (idle ? ' off' : '');
  }

  function render() {
    S.elapsedMs = currentElapsed();
    renderTime();

    var sv = statusView();
    var dotHtml = sv.dot ? '<span class="dot"></span>' : '';
    var st = $('status');
    st.className = 'st ' + sv.cls;
    st.innerHTML = dotHtml + escapeHtml(sv.text);
    var ms = $('mStatus');
    ms.className = 'st ' + sv.cls;
    ms.innerHTML = dotHtml + escapeHtml(sv.text);

    $('procName').textContent = S.process || (S.status === 'waiting' ? '（未选择）' : '—');
    $('procName').title = S.process || '';

    var cl = $('curline');
    if (S.line) {
      cl.className = 'curline';
      cl.innerHTML = (S.lineNo ? '<span class="ln">L' + S.lineNo + '</span>' : '') +
        escapeHtml(S.line);
    } else {
      cl.className = 'curline empty';
      cl.textContent = (S.persistent && S.status === 'waiting')
        ? '请在设置中选择要运行的剧情…'
        : '等待脚本指令…';
    }

    $('panel').className = 'panel' + (S.minimized ? ' min' : '');
    $('btnMin').textContent = S.minimized ? '+' : '–';

    renderHint();
    renderAbandon();
    renderLoop();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------------- 分辨率适配 ----------------
     最小化时向左平移，避开游戏右下角的技能图标（E/Q 冷却）。

     ★ 用户反馈「还要再向左移约 0.8 个最小化面板的宽度」，
       故基准由 260 提高到 500（1920 宽下约 375px）。
       仍按分辨率等比缩放，并设上下限避免极端屏宽下跑到屏幕外。 */
  function applyLayout() {
    try {
      var w = (typeof window !== 'undefined' && window.innerWidth) || 1920;
      var shift = Math.round(500 * w / 2560);
      if (shift < 300) shift = 300;      // 窄屏也要足够左移
      if (shift > 560) shift = 560;      // 超宽屏不要跑到屏幕中央
      var root = document.documentElement;
      if (root && root.style && root.style.setProperty) {
        root.style.setProperty('--mini-shift', shift + 'px');
      }
    } catch (e) { /* 忽略 */ }
  }

  /* ---------------- 设置窗口 ---------------- */
  function renderList() {
    var box = $('plist');
    if (!S.processes.length) {
      box.innerHTML = '<div class="pitem"><span class="nm" style="color:#666">' +
        '（未收到剧情列表）</span></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < S.processes.length; i++) {
      var p = S.processes[i];
      var isCur = (p.name === S.process);
      html += '<div class="pitem' + (isCur ? ' cur' : '') + '" data-name="' +
        escapeHtml(p.name) + '">' +
        '<span class="box"></span>' +
        '<span class="nm">' + escapeHtml(p.name) + '</span>' +
        /* ★ 「从指定行开始运行」入口 */
        '<button class="go" data-go="' + escapeHtml(p.name) + '"' +
        ' title="从指定行开始运行">▶</button>' +
        '</div>';
    }
    box.innerHTML = html;
    // 默认选中当前项
    var cur = box.querySelector('.pitem.cur') || box.querySelector('.pitem');
    if (cur) cur.classList.add('sel');
  }

  function openSettings() {
    renderList();
    $('mask').classList.add('show');
    // 打开设置时确保处于交互模式，否则点不到
    if (!S.interactive) setInteractive(true);
  }
  function closeSettings() {
    $('mask').classList.remove('show');
  }

  /* ---------------- 起始行选择窗口 ----------------
     点剧情项右侧的 ▶ → 请求该 process.json 的带行号指令列表 →
     展示 → 用户点选一行 → 「从选中行开始」发送 /switch{name,startLine}。
     line 使用 process.json 的**真实文件行号**，与编辑器一致。 */
  function openLinePicker(name) {
    S.linePickName = name;
    S.linePickSel = 0;
    S.linePickLines = [];
    $('linesProcName').textContent = name;
    $('llist').innerHTML = '<div class="lempty">正在读取指令列表…</div>';
    $('maskLines').classList.add('show');
    if (!S.interactive) setInteractive(true);
    sendToJs('/lines', { name: name });
  }

  function closeLinePicker() {
    $('maskLines').classList.remove('show');
    S.linePickName = '';
    S.linePickSel = 0;
    S.linePickLines = [];
  }

  /* 指令类别 → CSS 类名。
     目的：让用户一眼区分「导航 / 对话 / 战斗 / 等待 / 扩展」，
     快速找到想作为起点的位置。 */
  var CMD_CLASS = {
    '地图追踪': 'c-nav', '点击': 'c-nav', '点击文字': 'c-nav',
    '追踪图标': 'c-nav', '追踪委托': 'c-nav', '返回主界面': 'c-nav',
    '等待返回主界面': 'c-nav', '交互': 'c-nav', '图像匹配': 'c-nav',
    '对话': 'c-talk', '提示': 'c-talk',
    '战斗': 'c-fight', '切换队伍': 'c-fight', '切换角色体型': 'c-fight',
    '等待': 'c-flow', '暂停': 'c-flow', '切换': 'c-flow', '调时间': 'c-flow',
    '按键': 'c-flow',
    '注入': 'c-ext', '尝试': 'c-ext', '键鼠脚本': 'c-ext',
    '自动拾取': 'c-ext',
    '任务完成': 'c-done'
  };

  /* 不可选行的类别 → 类名 + 右侧标签 */
  var KIND_META = {
    comment: { cls: 'cmt', tag: '注释' },
    meta: { cls: 'meta', tag: '元数据' },
    header: { cls: 'head', tag: '块头' },
    unknown: { cls: 'unk', tag: '未识别' }
  };

  function renderLines() {
    var box = $('llist');
    if (!box) return;
    if (!S.linePickLines.length) {
      box.innerHTML = '<div class="lempty">（该剧情没有可执行的指令，' +
        '或尚未收到列表）</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < S.linePickLines.length; i++) {
      var it = S.linePickLines[i];
      /* 可执行指令（instr / 缺省）才可选；注释、元数据、块头一律不可选 */
      var selectable = (it.selectable === undefined)
        ? (it.kind === undefined || it.kind === 'instr')
        : !!it.selectable;

      var cls = 'lrow';
      var tag = '';
      if (selectable) {
        cls += ' ' + (CMD_CLASS[it.cmd] || '');
        if (it.line === S.linePickSel) cls += ' sel';
      } else {
        var m = KIND_META[it.kind] || KIND_META.unknown;
        cls += ' ' + m.cls;
        tag = '<span class="tag">' + m.tag + '</span>';
      }
      html += '<div class="' + cls + '" data-line="' + it.line + '"' +
        (selectable ? '' : ' data-lock="1"') + '>' +
        '<span class="lno">L' + it.line + '</span>' +
        '<span class="ltx">' + escapeHtml(it.text) + '</span>' +
        tag + '</div>';
    }
    box.innerHTML = html;
  }

  /* ---------------- 交互模式（点击穿透开关） ---------------- */
  function setInteractive(on) {
    S.interactive = !!on;
    sendToJs('/interactive', { enabled: S.interactive });
    render();
  }

  /* ---------------- 事件绑定 ---------------- */
  $('btnMin').addEventListener('click', function () {
    S.minimized = !S.minimized; render();
  });
  $('btnSettings').addEventListener('click', openSettings);
  /* ★ 「放弃剧情」按钮。
     语义由 JS 侧按模式决定：
       · 持续运行模式 → 放弃当前剧情，回到「等待选择」状态
       · 其他模式     → 放弃当前剧情并结束脚本
     空闲态（没有剧情在跑）时按钮已置灰，这里再兜一层判断。 */
  $('btnAbandon').addEventListener('click', function () {
    if (S.status === 'waiting') return;      // 空闲态无可放弃
    sendToJs('/abandon', {});
    S.status = 'abandoning';
    render();
  });
  $('btnCancel').addEventListener('click', function () {
    closeSettings();
    setInteractive(false);   // 关闭设置后恢复点击穿透，避免挡到游戏操作
  });
  $('btnOk').addEventListener('click', function () {
    var sel = document.querySelector('.pitem.sel');
    if (!sel) { closeSettings(); setInteractive(false); return; }
    var name = sel.getAttribute('data-name');
    sendToJs('/switch', { name: name });
    closeSettings();
    setInteractive(false);
  });
  $('plist').addEventListener('click', function (e) {
    /* ★ 先判断是否点了「▶ 从指定行开始」按钮 */
    var go = e.target.closest ? e.target.closest('.go') : null;
    if (go) {
      var nm = go.getAttribute('data-go');
      if (nm) { openLinePicker(nm); }
      return;                      // 不要同时改变选中项
    }
    var it = e.target.closest ? e.target.closest('.pitem') : null;
    if (!it || !it.getAttribute('data-name')) return;
    var all = document.querySelectorAll('.pitem');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
    it.classList.add('sel');
  });
  // 点击设置窗口外的空白 → 退出交互模式（避免长时间挡住游戏鼠标）
  $('mask').addEventListener('mousedown', function (e) {
    if (e.target === $('mask')) { closeSettings(); setInteractive(false); }
  });

  /* ---------------- 起始行选择窗口的事件 ---------------- */
  $('llist').addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.lrow') : null;
    if (!row) return;
    /* ★ 注释 / 元数据 / 块头 / 未识别 行不可选 */
    if (row.getAttribute('data-lock')) return;
    var ln = parseInt(row.getAttribute('data-line'), 10) || 0;
    if (!ln) return;
    S.linePickSel = ln;
    var all = $('llist').querySelectorAll('.lrow');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
    row.classList.add('sel');
  });
  /* ★ 「取消」只关闭起始行窗口，**回到剧情选择页**，不退出交互模式。
     bug 修复：原先这里调用了 setInteractive(false)，会恢复点击穿透，
     于是回到剧情选择页后整个面板都点不动了（窗口还在，却无法交互）。
     正确语义：取消 = 退回上一层（剧情选择），交互模式应当保持。 */
  $('btnLinesCancel').addEventListener('click', function () {
    closeLinePicker();
  });
  $('btnLinesOk').addEventListener('click', function () {
    if (!S.linePickSel) return;                 // 未选行 → 不响应
    /* ★ 兜底：确认时再校验一次选中行确实可选
       （防止通过异常路径把注释/块头行号提交上去） */
    var okRow = false;
    for (var i = 0; i < S.linePickLines.length; i++) {
      var it = S.linePickLines[i];
      var sel = (it.selectable === undefined)
        ? (it.kind === undefined || it.kind === 'instr')
        : !!it.selectable;
      if (it.line === S.linePickSel && sel) { okRow = true; break; }
    }
    if (!okRow) return;
    sendToJs('/switch', { name: S.linePickName, startLine: S.linePickSel });
    /* 确认后才两层一起关，此时退出交互模式是正确的 */
    closeLinePicker();
    closeSettings();
    setInteractive(false);
  });
  /* 点起始行窗口外的空白 → 同样只退回剧情选择页（保持交互模式） */
  $('maskLines').addEventListener('mousedown', function (e) {
    if (e.target === $('maskLines')) { closeLinePicker(); }
  });

  /* ---------------- 接收 JS 侧消息 ---------------- */
  function onMessage(msg) {
    if (!msg || typeof msg !== 'object') return;
    S.lastMsgAt = Date.now();

    var url = msg.url, data = msg.data || {};

    if (url === '/init') {
      if (data.processes) S.processes = data.processes;
      if (data.current) S.process = data.current;
      if (data.status) S.status = data.status;
      syncElapsed(data.elapsedMs);
    } else if (url === '/progress') {
      syncElapsed(data.elapsedMs);
      if (data.status) S.status = data.status;
      if (data.process) S.process = data.process;
      if (typeof data.line === 'string') S.line = data.line;
      if (typeof data.lineNo === 'number') S.lineNo = data.lineNo;
    } else if (url === '/status') {
      if (data.status) S.status = data.status;
      syncElapsed(data.elapsedMs);
    } else if (url === '/line') {
      S.line = data.line || '';
      S.lineNo = data.lineNo || 0;
      syncElapsed(data.elapsedMs);
    } else if (url === '/loop') {
      /* ★ 循环进度（「地图追踪 / 键鼠脚本」的参数重载）。
         done=0 && total=0 表示清除（切到别的指令了）。 */
      S.loopDone = data.done || 0;
      S.loopTotal = data.total || 0;
      renderLoop();
      return;                    // 只更新进度，不必整页 render
    } else if (url === '/processes') {
      S.processes = data.processes || [];
      if (data.current) S.process = data.current;
    } else if (url === '/toggle') {
      /* ★ 最小化切换（N 键）。
         JS 侧可能「直发一次 + 兜底重发若干次」，同一 seq 会到达多次。
         用 seq 去重：只有更大的 seq 才真正切换，避免面板来回跳。
         切换后立刻回执 /toggle-ack，JS 收到即停止重发。 */
      var seq = (typeof data.seq === 'number') ? data.seq : 0;
      if (seq > lastToggleSeq) {
        lastToggleSeq = seq;
        S.minimized = !S.minimized;        // N 键最小化
        sendToJs('/toggle-ack', { seq: seq, minimized: S.minimized });
      }
      // seq <= lastToggleSeq：重复投递，忽略（但仍要 render 一次以保持一致）
    } else if (url === '/interactive') {
      S.interactive = !!data.enabled;
    } else if (url === '/mode') {
      // ★ 持续运行模式开关（JS 侧 setPersistentMode 推送）
      S.persistent = !!data.persistent;
    } else if (url === '/lines') {
      // ★ 收到某剧情的带行号指令列表 → 渲染起始行选择窗口
      if (data.name && data.name === S.linePickName) {
        S.linePickLines = Array.isArray(data.lines) ? data.lines : [];
        /* 默认选中**第一条可选**的指令（跳过开头的注释/元数据） */
        S.linePickSel = 0;
        for (var i = 0; i < S.linePickLines.length; i++) {
          var it = S.linePickLines[i];
          var ok = (it.selectable === undefined)
            ? (it.kind === undefined || it.kind === 'instr')
            : !!it.selectable;
          if (ok) { S.linePickSel = it.line; break; }
        }
        renderLines();
        return;                    // 不需要整页 render
      }
    }
    render();
  }

  if (hasMask) {
    window.htmlMask.onMessage = onMessage;
  }
  if (hasWV) {
    window.chrome.webview.addEventListener('message', function (ev) {
      var m = ev.data;
      if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
      onMessage(m);
    });
  }

  // 布局适配（写入 --mini-shift）
  applyLayout();
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', applyLayout);
  }

  /* ★ 入场动画：面板从右下滑入（官方示例同样有入场动画）。
     动画结束后**必须移除 enter 类**，否则 animation 的 fill 模式
     会一直覆盖 transform，导致最小化的 translateX 失效。 */
  (function playEnter() {
    var panel = $('panel');
    if (!panel || !panel.classList) return;
    panel.classList.add('enter');
    var clear = function () { try { panel.classList.remove('enter'); } catch (e) { } };
    if (typeof setTimeout === 'function') setTimeout(clear, 500);
    else clear();
  })();

  /* ★ 本地计时器：即使 JS 侧长时间不推送，时间也照常走秒。
     只更新时间文本，不做整页 render，开销极小。 */
  if (typeof setInterval === 'function') {
    setInterval(function () {
      if (!S.baseAt) return;
      renderTime();
    }, 250);
  }

  // 通知 JS 侧：页面已就绪，可以开始推送数据
  // （JS 侧 showOverlay 会 await 这条消息，避免首帧数据丢失）
  sendToJs('/ready', {});

  /* ---------------- demo 模式（普通浏览器预览用） ---------------- */
  if (!hasMask && !hasWV) {
    S.processes = [
      { name: '上船', path: 'process\\上船\\process.json' },
      { name: '捕风的异乡人9503', path: 'process\\捕风的异乡人9503\\process.json' },
      { name: '托马邀约任务_寄托思念的海风', path: 'process\\托马邀约任务_寄托思念的海风\\process.json' }
    ];
    S.process = '捕风的异乡人9503';
    S.status = 'running';
    S.line = '地图追踪 捕风的异乡人-1.json';
    S.lineNo = 42;
    S.lastMsgAt = Date.now();
    syncElapsed(0);
    var demoLines = [
      '地图追踪 捕风的异乡人-1.json',
      '等待 3000',
      '点击 1840,1000',
      '对话 凯文',
      '切换队伍 战斗 否',
      '战斗',
      '任务完成'
    ];
    var di = 0;
    setInterval(function () {
      di = (di + 1) % demoLines.length;
      S.line = demoLines[di];
      S.lineNo = 42 + di;
      S.lastMsgAt = Date.now();
      render();
    }, 1000);
    console.log('[overlay] 未检测到 htmlMask，已进入 demo 预览模式');
  }

  render();
})();
</script>
</body>
</html>
